#
# Nightly fast-forward of vendor/upstream to riscv-software-src/riscv-isa-sim
# master. Pushes with a deploy key (secret UA_SYNC_DEPLOY_KEY) that is on the
# ruleset's bypass list. Never force-pushes: if upstream rewrote history, the
# job fails and says so.

name: Sync vendor/upstream

on:
  schedule:
    - cron: '23 8 * * *'   # 02:23 US Central (standard time)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-vendor-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vendor/upstream
          fetch-depth: 0
          ssh-key: ${{ secrets.UA_SYNC_DEPLOY_KEY }}

      - name: Fast-forward vendor/upstream
        run: |
          git fetch --no-tags -q https://github.com/riscv-software-src/riscv-isa-sim.git master
          new=$(git rev-parse FETCH_HEAD)
          old=$(git rev-parse HEAD)
          if [ "$new" = "$old" ]; then
            echo "vendor/upstream is up to date at ${old:0:7}"
          elif git merge-base --is-ancestor "$old" "$new"; then
            git push origin "$new:refs/heads/vendor/upstream"
            echo "vendor/upstream ${old:0:7} -> ${new:0:7} ($(git rev-list --count "$old..$new") commits)"
          else
            echo "::error::upstream master is not a fast-forward of vendor/upstream; not pushing"
            exit 1
          fi
          behind=$(git rev-list --count "$(git merge-base origin/main "$new")..$new")
          echo "main is $behind upstream commits behind vendor/upstream"
